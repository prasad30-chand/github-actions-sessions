name: secrets and variable workflow

on:
  push:
    branches:
      - main

jobs:
  secrets-and-variable-job:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print Welcome Message
        run: echo "Hello! This is the secrets and variable workflow" 

      -name: check secrets ancd variables
        run: |
          echo "The value of the secret is: ${{ secrets.password }}"
          echo "The value of the variable is: ${{ vars.username` }}"
