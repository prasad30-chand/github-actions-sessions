
name: My First GitHub Actions

on:
  workflow_dispatch:
  input:
    environment:
      description: "Select the environment for the workflow"
      required: true
      default: "development"  
      type: choice
      options:
        - development
        - staging
        - production

jobs:
  demo-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print Welcome Message
        run: echo "Hello! My first GitHub Actions workflow"

      - name: Check Current Directory
        run: pwd

      - name: List Files
        run: ls -la
