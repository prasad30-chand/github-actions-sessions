
name: My First GitHub Actions

on:
  push:
    branches:
      - main

jobs:
  demo-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print Welcome Message
        run: echo "Hello! My first GitHub Actions workflow"

      - name: Check Current Directory
        run: pwd

      - name: List Files
        run: ls -la
